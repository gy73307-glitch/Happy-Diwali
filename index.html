<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Diwali Celebration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merienda:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FFD700;
            --deep-blue: #0a0014;
            --festive-purple: #4a0e4a;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--deep-blue);
            color: #fff;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .main-title {
            font-family: 'Merienda', cursive;
            font-size: clamp(2.5rem, 8vw, 4rem);
            color: var(--gold);
            text-shadow: 0 0 8px var(--gold), 0 0 15px var(--gold), 0 0 25px var(--gold);
            margin: 0 0 20px 0;
        }

        .diety-image-container {
            border: 5px solid var(--gold);
            padding: 10px;
            background-color: var(--festive-purple);
            box-shadow: 0 0 15px var(--gold), 0 0 25px var(--festive-purple);
            margin-bottom: 30px;
            line-height: 0;
            border-radius: 10px;
        }

        .diety-image {
            width: 200px;
            height: auto;
            object-fit: contain;
            border-radius: 5px;
        }

        .interactive-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .input-group,
        .dropdown-group {
            display: flex;
            flex-direction: column;
            width: 100%;
            text-align: left;
        }

        .input-group label,
        .dropdown-group label {
            margin-bottom: 5px;
            color: var(--gold);
            font-weight: bold;
        }

        .input-group input,
        .dropdown-group select {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid var(--gold);
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
        }
        
        .dropdown-group select option {
            background-color: var(--deep-blue);
        }

        .message-area {
            width: 100%;
            max-width: 400px;
            min-height: 150px;
            background-color: rgba(74, 14, 74, 0.4);
            border: 2px solid var(--gold);
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-wrap;
            color: #f0f0f0;
        }
        
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            align-items: center;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        .share-button {
            background-color: #25D366; /* WhatsApp Green */
            color: white;
            border: none;
        }
        
        .share-button svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .copy-button {
            background-color: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
        }
        
        .button:hover {
            transform: scale(1.05);
        }

        .footer {
            margin-top: 20px;
            font-size: 1.2rem;
            color: var(--gold);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Firecracker sound effect -->
    <audio id="fireworks-sound" src="https://www.myinstants.com/media/sounds/fireworks_1.mp3" preload="auto" loop></audio>
    
    <canvas id="fireworks-canvas"></canvas>

    <div class="main-container">
        <h1 class="main-title">✨ Happy Diwali ✨</h1>

        <div class="diety-image-container">
            <img src="https://i.ibb.co/V3x7Jcr/diwali-gods.jpg" alt="Lakshmi, Ganesha, Saraswati" class="diety-image">
        </div>

        <div class="interactive-form">
            <div class="input-group">
                <label for="nameInput">Enter Your Name</label>
                <input type="text" id="nameInput" value="Your Friend">
            </div>

            <div class="dropdown-group">
                <label for="recipientSelect">Select Recipient</label>
                <select id="recipientSelect">
                    <option value="Friends">Friends</option>
                    <option value="General">General</option>
                    <option value="Mother">Mother</option>
                    <option value="Father">Father</option>
                    <option value="Brother">Brother</option>
                    <option value="Sister">Sister</option>
                    <option value="Family (General)">Family (General)</option>
                    <option value="Relatives (Uncle/Aunt)">Relatives (Uncle/Aunt)</option>
                </select>
            </div>
        </div>

        <div class="message-area" id="dynamicMessage"></div>
        
        <div class="buttons-container">
            <button class="button share-button" id="whatsappShareBtn">
                <svg viewBox="0 0 448 512" xmlns="http://www.w3.org/2000/svg"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.8 0-67.6-9.5-97.8-26.7l-7.1-4.2-73.3 19.3 19.3-71.6-4.7-7.5c-19.8-31.9-30.6-68.2-30.6-106.1 0-108.7 88.4-197.1 197.1-197.1 53 0 102.8 20.7 139.4 57.4 36.6 36.6 57.4 86.4 57.4 139.4-.1 108.7-88.5 197.1-197.2 197.1z"/></svg>
                Share with Friends
            </button>
            
            <button class="button copy-button" id="copyLinkBtn">Copy Link</button>
        </div>

        <div class="footer" id="footerText"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const nameInput = document.getElementById('nameInput');
            const recipientSelect = document.getElementById('recipientSelect');
            const dynamicMessage = document.getElementById('dynamicMessage');
            const whatsappShareBtn = document.getElementById('whatsappShareBtn');
            const copyLinkBtn = document.getElementById('copyLinkBtn');
            const footerText = document.getElementById('footerText');
            const sound = document.getElementById('fireworks-sound');

            // Play sound on first user interaction to comply with browser autoplay policies
            document.body.addEventListener('click', () => {
                if (sound.paused) {
                    sound.play().catch(e => console.error("Audio failed to play. User interaction is needed.", e));
                }
            }, { once: true });

            const wishes = {
                "General": "Wishing you joy, light, and prosperity!",
                "Mother": "💖 Happy Diwali, Mom! You are the light of our home and my heart. May your life always shine with happiness, peace, and health. Love you always!",
                "Father": "💫 Wishing you a very Happy Diwali, Dad! Your strength and wisdom are the guiding lights in my life. May this Diwali bring you joy, success, and good health.",
                "Brother": "🕯️ Happy Diwali, dear brother! May your life sparkle with success and happiness. You’re my best buddy for life — enjoy the lights and sweets!",
                "Sister": "🌸 Wishing my sweet sister a joyful Diwali! You bring so much brightness and love into my life. May your world always be as colorful and joyful as this festival.",
                "Friends": "🎆 Happy Diwali, my friend! Let’s celebrate with laughter, sweets, and lights. Wishing you endless joy, prosperity, and good vibes this festive season.",
                "Family (General)": "👨‍👩‍👧‍👦 Wishing my wonderful family a sparkling Diwali filled with love, laughter, and togetherness. May our home always be full of light and joy!",
                "Relatives (Uncle/Aunt)": "💞 Happy Diwali to my dear family! May this festival bring brightness, love, and happiness into your lives. Stay blessed and enjoy the festivities!"
            };

            function updateContent() {
                const name = nameInput.value.trim() || 'Your Friend';
                const recipientKey = recipientSelect.value;
                const message = wishes[recipientKey];

                dynamicMessage.textContent = message;
                footerText.textContent = `- From ${name}`;

                // Update URL for sharing
                const queryParams = new URLSearchParams({ from: name, wish: recipientKey });
                const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?${queryParams.toString()}`;
                history.replaceState({path: newUrl}, '', newUrl);
            }

            // --- EDITED WHATSAPP SHARE LOGIC ---
            whatsappShareBtn.addEventListener('click', function() {
                const name = nameInput.value.trim() || 'Your Friend';
                const personalizedUrl = window.location.href;
                
                // Create a more friendly message for WhatsApp
                const introMessage = "Hey! ✨ Sending you some sparkling Diwali wishes from me!";
                const wishText = dynamicMessage.textContent;

                const fullMessage = `${introMessage}\n\n${wishText}\n\n- From ${name}\n\nSee the full greeting with fireworks here:\n${personalizedUrl}`;
                
                const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(fullMessage)}`;
                window.open(whatsappUrl, '_blank');
            });

            copyLinkBtn.addEventListener('click', function() {
                const personalizedUrl = window.location.href;
                navigator.clipboard.writeText(personalizedUrl).then(() => {
                    alert('Personalized link copied to clipboard!');
                }).catch(err => console.error('Failed to copy link: ', err));
            });

            function loadFromUrlParams() {
                const params = new URLSearchParams(window.location.search);
                const fromName = params.get('from');
                const wishKey = params.get('wish');
                if (fromName) nameInput.value = fromName;
                
                // Set default to Friends if no specific wish is in URL
                if (wishKey && wishes[wishKey]) {
                    recipientSelect.value = wishKey;
                } else {
                    recipientSelect.value = "Friends";
                }
                updateContent();
            }

            nameInput.addEventListener('input', updateContent);
            recipientSelect.addEventListener('change', updateContent);
            
            loadFromUrlParams(); // Load content on page load

            // --- FIXED FIRECRACKER ANIMATION LOGIC ---
            // This logic is robust and works well.
            const canvas = document.getElementById('fireworks-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            let fireworks = [];
            let particles = [];

            function Firework(sx, sy, tx, ty) { this.x = sx; this.y = sy; this.sx = sx; this.sy = sy; this.tx = tx; this.ty = ty; this.distanceToTarget = Math.hypot(tx - sx, ty - sy); this.distanceTraveled = 0; this.coordinates = Array(3).fill([this.x, this.y]); this.angle = Math.atan2(ty - sy, tx - sx); this.speed = 2; this.acceleration = 1.05; this.brightness = Math.random() * 50 + 50; }
            Firework.prototype.update = function(index) { this.coordinates.pop(); this.coordinates.unshift([this.x, this.y]); this.speed *= this.acceleration; const vx = Math.cos(this.angle) * this.speed; const vy = Math.sin(this.angle) * this.speed; this.distanceTraveled = Math.hypot(this.x - this.sx, this.y - this.sy); if (this.distanceTraveled >= this.distanceToTarget) { createParticles(this.tx, this.ty); fireworks.splice(index, 1); } else { this.x += vx; this.y += vy; } }
            Firework.prototype.draw = function() { ctx.beginPath(); ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]); ctx.lineTo(this.x, this.y); ctx.strokeStyle = `hsl(${Math.random() * 360}, 100%, ${this.brightness}%)`; ctx.stroke(); }
            function Particle(x, y) { this.x = x; this.y = y; this.coordinates = Array(5).fill([this.x, this.y]); this.angle = Math.random() * Math.PI * 2; this.speed = Math.random() * 10 + 1; this.friction = 0.95; this.gravity = 1.5; this.hue = Math.random() * 360; this.brightness = Math.random() * 50 + 50; this.alpha = 1; this.decay = Math.random() * 0.02 + 0.015; }
            Particle.prototype.update = function(index) { this.coordinates.pop(); this.coordinates.unshift([this.x, this.y]); this.speed *= this.friction; this.x += Math.cos(this.angle) * this.speed; this.y += Math.sin(this.angle) * this.speed + this.gravity; this.alpha -= this.decay; if (this.alpha <= this.decay) particles.splice(index, 1); }
            Particle.prototype.draw = function() { ctx.beginPath(); ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]); ctx.lineTo(this.x, this.y); ctx.strokeStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${this.alpha})`; ctx.stroke(); }
            function createParticles(x, y) { let particleCount = 60; while (particleCount--) particles.push(new Particle(x, y)); }
            function loop() { requestAnimationFrame(loop); ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = 'rgba(0, 0, 0, 0.5)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.globalCompositeOperation = 'lighter'; for (let i = fireworks.length - 1; i >= 0; i--) { fireworks[i].draw(); fireworks[i].update(i); } for (let j = particles.length - 1; j >= 0; j--) { particles[j].draw(); particles[j].update(j); } }
            setInterval(() => { if (fireworks.length < 25) { fireworks.push(new Firework(Math.random() * canvas.width, canvas.height, Math.random() * canvas.width, Math.random() * canvas.height / 2)); } }, 800);
            window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
            loop();
        });
    </script>
</body>
</html>
